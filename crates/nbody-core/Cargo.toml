[package]
name = "nbody-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Newtonian N-body gravitational dynamics: symplectic integrators, Barnes-Hut, layered spherical bodies, collisions and projectile capture/ejection analysis"

[dependencies]
serde.workspace = true
toml.workspace = true
serde_json.workspace = true
rand.workspace = true
thiserror.workspace = true

[dev-dependencies]
approx = "0.5"

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `rand` pulls in getrandom, which needs its JavaScript backend on the web.
getrandom = { version = "0.2", features = ["js"] }
