name = "Lagrange's triangle"
description = "Masses 1, 0.6 and 0.3 at the corners of an equilateral triangle, each on an ellipse of eccentricity 0.5 about the common centre of mass, G = 1. The triangle turns and breathes but stays equilateral (period 12.893). For masses this similar the configuration is unstable, so round-off eventually tips it into chaos; the stable case needs one body to carry over 96% of the mass."

