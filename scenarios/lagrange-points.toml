name = "Lagrange points"
description = "Jupiter on a circular orbit about the Sun, with a probe parked at each Lagrange point and ten Trojans around L4 and L5. In the frame co-rotating with Jupiter the probes should stand still: L4 and L5 are stable (the mass ratio 0.00095 is below Routh's 0.0385) and the swarms trace tadpole-shaped librations, while L1, L2 and L3 are saddle points whose probes drift off within a few Jupiter years."

[units]
length = "au"
mass = "solar"
time = "year"

[simulation]
integrator = "yoshida4"
dt = 0.004
softening = 0.0
collisions = "physical"
force = "direct"
theta = 0.5
duration = 300.0
barycentric = true

