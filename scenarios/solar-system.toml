name = "Solar System"
description = "Sun and the eight planets from JPL's J2000 mean elements. Two-layer planets (core + mantle) reproduce each body's bulk mass and radius."

[units]
length = "au"
mass = "solar"
time = "year"

[simulation]
integrator = "yoshida4"
dt = 0.0005
softening = 0.0
collisions = "physical"
force = "direct"
theta = 0.5
duration = 12.0
barycentric = true

