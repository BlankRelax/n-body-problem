name = "TRAPPIST-1"
description = "An ultracool dwarf of 0.09 solar masses with seven Earth-sized planets whose periods run from 1.5 to 18.8 days in a chain of near resonances (8:5, 5:3, 3:2, 3:2, 4:3, 3:2). The whole system would fit inside Mercury's orbit."

