name = "Rosette"
description = "Eight Ceres-mass asteroids on one-year orbits of eccentricity 0.7 about the Sun, each orbit turned by 45 degrees from its neighbour. Over a year their trails draw an eight-petal rosette; the asteroids speed through periapsis at 0.3 au and dawdle at 1.7 au."

