name = "Co-orbital motion"
description = "A planet of one thousandth of its star's mass and four test masses on the same orbit, G = 1. 'Tadpole A' and 'Tadpole B' were released at rest in the rotating frame some way from L4 and L5, so they librate about those points on tadpole-shaped paths. 'Horseshoe in' and 'Horseshoe out' start opposite the planet on orbits 3% smaller and larger; they gain on the planet, are turned around by it before they can reach it, and swing back round the other way, tracing a horseshoe in the co-rotating frame."

[units]
length = "m"
mass = "kg"
time = "s"

[simulation]
integrator = "pefrl"
dt = 0.005
softening = 0.0
collisions = "none"
force = "direct"
theta = 0.5
g = 1.0
duration = 400.0
barycentric = true

