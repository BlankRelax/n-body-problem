name = "Sitnikov problem"
description = "Two equal stars on an orbit of eccentricity 0.6, and a test mass dropped from rest on the axis through their centre of mass, G = 1. The test mass falls through the plane and back, but the stars' changing separation pumps or drains its energy each time, so its bobbing is chaotic and it can be thrown off altogether. Tilt the view (right-drag) to see the third dimension."

[units]
length = "m"
mass = "kg"
time = "s"

[simulation]
integrator = "pefrl"
softening = 0.0
collisions = "none"
force = "direct"
theta = 0.5
g = 1.0
duration = 80.0
barycentric = true

[simulation.adaptive]
eta = 0.01
dt_min = 0.000000001
dt_max = 0.005

[[bodies]]
name = "Star A"
kind = "star"
mass = 0.5
material = "plasma"
position = [
    -0.8,
    0.0,
    0.0,
]
velocity = [
    0.0,
    -0.25,
    0.0,
]

[[bodies]]
name = "Star B"
kind = "star"
mass = 0.5
material = "plasma"
position = [
    0.8,
    0.0,
    0.0,
]
velocity = [
    0.0,
    0.25,
    0.0,
]

[[bodies]]
name = "Bob"
kind = "asteroid"
mass = 0.000000001
material = "ice"
position = [
    0.0,
    0.0,
    1.3,
]
velocity = [
    0.0,
    0.0,
    0.0,
]

[view]
corotating = false
trail_span = 25.0
tilt = 65.0
