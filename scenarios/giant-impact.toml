name = "Giant impact"
description = "A Mars-sized body of a tenth of an Earth mass strikes the 0.9-Earth-mass proto-Earth at a 45-degree angle and 1.04 times their mutual escape speed (9.5 km/s at contact), the canonical Moon-forming impact. Press Launch: the physical collision model decides whether the pair merges or Theia survives a hit-and-run; the merger's layers differentiate, iron sinking to the core."

