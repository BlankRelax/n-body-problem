name = "Galaxy collision"
description = "Two disc galaxies, 10 and 5 billion solar masses, each a point-mass nucleus dressed with rings of test stars (148 and 93) on circular orbits, approaching on a slow prograde orbit with a closest approach of 6 kpc about 300 Myr in. The passage draws out tidal tails and a bridge between them, in the manner of Toomre & Toomre (1972); being slightly bound, the pair falls back together and merges."

[units]
length = "kpc"
mass = "solar"
time = "myr"

[simulation]
integrator = "yoshida4"
dt = 0.5
softening = 0.05
collisions = "none"
force = "barnes_hut"
theta = 0.6
duration = 1500.0
barycentric = true

